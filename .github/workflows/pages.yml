name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      # Two files outside docs/ that the site renders. The version in the nav is read out of
      # the manifest and the changelog page is CHANGELOG.md itself, so a release that
      # touches only these would otherwise leave the site serving the previous version and
      # the previous release notes until something in docs/ happened to change.
      - "Cargo.toml"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pointed at docs/package.json, because that is where `packageManager` lives and the
      # action looks in the repository root by default. Without this it finds no version
      # and fails before installing anything. Reading the pin rather than naming a version
      # here keeps CI on the same pnpm the lockfile was written by.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm build
        working-directory: docs
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      # Files outside docs/ that the site renders. The version in the nav is read out of
      # the manifest, and the changelog, licence and privacy pages are those files
      # themselves, so a change that touches only these would otherwise leave the site
      # serving the previous copy until something in docs/ happened to change.
      - "Cargo.toml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PRIVACY.md"
      - ".github/workflows/pages.yml"
  # /download/ lists releases as they stood at build time, and the dmg is attached by the
  # release workflow some minutes after the tag, so the site rebuilds once that finishes.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A failed release attached nothing new, so there is nothing to rebuild for.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pointed at docs/package.json, because that is where `packageManager` lives and the
      # action looks in the repository root by default. Without this it finds no version
      # and fails before installing anything. Reading the pin rather than naming a version
      # here keeps CI on the same pnpm the lockfile was written by.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm build
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 126" width="220" height="231" role="img" aria-label="Arin phoenix logo">
  <title>Arin — phoenix logo, animated</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="44%" r="52%">
      <stop offset="6%" stop-color="#1E3A8A" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#1E3A8A" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plume" x1="0.5" y1="1" x2="0.2" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7FE3FF"/>
    </linearGradient>
    <linearGradient id="plumeR" x1="0.5" y1="1" x2="0.8" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7FE3FF"/>
    </linearGradient>
    <linearGradient id="tailg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="heart" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="32%" stop-color="#A9DCFF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="54" r="56" fill="url(#halo)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="3.6s"
      repeatCount="indefinite" values="0 2; 0 -2; 0 2"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
    <g fill="url(#tailg)">
      <animateTransform attributeName="transform" type="rotate" dur="4.4s"
        repeatCount="indefinite" values="-2 60 66; 2 60 66; -2 60 66"
        calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
      <path d="M 56 65 C 50 82, 42 97, 31 110 C 41 95, 47 80, 52 63 Z" opacity="0.8"/>
      <path d="M 57.5 67 C 55 86, 55 104, 60 121 C 65 104, 65 86, 62.5 67 Z"/>
      <path d="M 64 65 C 70 82, 78 97, 89 110 C 79 95, 73 80, 68 63 Z" opacity="0.8"/>
    </g>
    <g fill="url(#plume)">
        <animateTransform attributeName="transform" type="rotate" dur="3.6s"
          repeatCount="indefinite" values="-8 54 45; 5 54 45; -8 54 45" calcMode="spline"
          keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
      <path d="M 54 37 C 40 29, 21 18, 6 10 C 16 23, 33 35, 53 43 Z"/><path d="M 54 43 C 42 41, 25 36, 10 29 C 23 40, 38 48, 53 50 Z" opacity="0.9"/><path d="M 54 49 C 45 52, 33 54, 21 53 C 33 59, 45 59, 53 55 Z" opacity="0.8"/>
    </g>
    <g fill="url(#plumeR)">
        <animateTransform attributeName="transform" type="rotate" dur="3.6s"
          repeatCount="indefinite" values="8 66 45; -5 66 45; 8 66 45" calcMode="spline"
          keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
      <path d="M 66 37 C 80 29, 99 18, 114 10 C 104 23, 87 35, 67 43 Z"/><path d="M 66 43 C 78 41, 95 36, 110 29 C 97 40, 82 48, 67 50 Z" opacity="0.9"/><path d="M 66 49 C 75 52, 87 54, 99 53 C 87 59, 75 59, 67 55 Z" opacity="0.8"/>
    </g>
    <path d="M 60 25 C 67 33, 69 47, 66 60 C 64 70, 56 70, 54 60 C 51 47, 53 33, 60 25 Z" fill="url(#plume)"/>
    <path d="M 64 12 C 71 6, 78 4, 85 4 C 78 9, 72 13, 67 17 Z" fill="url(#plume)"/>
    <circle cx="60" cy="20" r="7.2" fill="#3B82F6"/>
    <path d="M 53 18 L 42 21 L 53 26 Z" fill="#7FE3FF"/>
    <circle cx="61.5" cy="19" r="1.5" fill="#0D1220"/>
    <circle cx="60" cy="50" r="7.8" fill="url(#heart)">
      <animate attributeName="r" dur="3.6s" repeatCount="indefinite" values="7.4;8.6;7.4"
        calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/></circle>
  </g>

  <g fill="#7FE3FF">
    <circle cx="46" r="2">
      <animate attributeName="cy" dur="2.8s" repeatCount="indefinite" values="60;8"/>
      <animate attributeName="opacity" dur="2.8s" repeatCount="indefinite" values="0;0.8;0"/>
    </circle>
    <circle cx="74" r="1.6">
      <animate attributeName="cy" dur="3.3s" begin="0.9s" repeatCount="indefinite" values="60;6"/>
      <animate attributeName="opacity" dur="3.3s" begin="0.9s" repeatCount="indefinite" values="0;0.7;0"/>
    </circle>
    <circle cx="60" r="1.2">
      <animate attributeName="cy" dur="3.0s" begin="1.7s" repeatCount="indefinite" values="56;2"/>
      <animate attributeName="opacity" dur="3.0s" begin="1.7s" repeatCount="indefinite" values="0;0.55;0"/>
    </circle>
  </g>
</svg>

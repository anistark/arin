[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "An annotation layer any agent can draw on."
keywords = ["annotation", "overlay", "agent", "mcp", "accessibility"]
categories = ["visualization", "command-line-utilities"]

[workspace.dependencies]
# Local crates.
arin-cli = { path = "crates/arin-cli", version = "0.1.0" }
arin-core = { path = "crates/arin-core", version = "0.1.0" }
arin-linux = { path = "crates/arin-linux", version = "0.1.0" }
arin-mac = { path = "crates/arin-mac", version = "0.1.0" }
arin-mcp = { path = "crates/arin-mcp", version = "0.1.0" }
arin-protocol = { path = "crates/arin-protocol", version = "0.1.0" }
arin-resolve = { path = "crates/arin-resolve", version = "0.1.0" }
arin-win = { path = "crates/arin-win", version = "0.1.0" }

# Shared third party.
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
futures = "0.3.33"
global-hotkey = "0.8.0"
libc = "0.2.189"
rmcp = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "fast-rng"] }

# macOS platform stack. Pulled in only by arin-mac, under a target gate.
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-screen-capture-kit = "0.3.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

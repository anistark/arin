[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/anistark/arin"
description = "An annotation layer any agent can draw on."
keywords = ["annotation", "overlay", "agent", "mcp", "accessibility"]
categories = ["visualization", "command-line-utilities"]

[workspace.dependencies]
# Local crates.
arin = { path = "crates/arin", version = "0.4.1" }
arin-cli = { path = "crates/arin-cli", version = "0.4.1" }
arin-core = { path = "crates/arin-core", version = "0.4.1" }
arin-linux = { path = "crates/arin-linux", version = "0.4.1" }
arin-mac = { path = "crates/arin-mac", version = "0.4.1" }
arin-mcp = { path = "crates/arin-mcp", version = "0.4.1" }
arin-protocol = { path = "crates/arin-protocol", version = "0.4.1" }
arin-resolve = { path = "crates/arin-resolve", version = "0.4.1" }
arin-win = { path = "crates/arin-win", version = "0.4.1" }

# Shared third party.
anyhow = "1.0.104"
base64 = "0.23.0"
clap = { version = "4.6.4", features = ["derive", "env"] }
futures = "0.3.33"
# Encoding only, and only in `arin-resolve`. A resolver has to hand a model an image, and
# a screenshot is the one thing in this repo that leaves the machine.
png = { version = "0.18.1", default-features = false }
# Defaults carry rustls, so a distributed binary does not depend on whatever OpenSSL the
# machine happens to have, and the system proxy settings are honoured.
reqwest = { version = "0.13.4", features = ["json"] }
global-hotkey = "0.8.0"
libc = "0.2.189"
rmcp = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "fast-rng"] }

# macOS platform stack. Pulled in only by arin-mac, under a target gate.
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-screen-capture-kit = "0.3.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

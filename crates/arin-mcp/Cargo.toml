[package]
name = "arin-mcp"
description = "MCP server for Arin. Translates MCP tool calls into socket messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# Not published. Only `arin-protocol` goes to crates.io today, because it is the only
# crate with readers outside this repo. This is a safety catch rather than a policy: a
# stray `cargo publish` here would burn the name at 0.1.0 on a crate with no README, and
# crates.io versions can be yanked but never reused. Lift it per crate as each one is
# actually packaged. See the distribution row in `AGENTS.md`.
publish = false

[[bin]]
name = "arin-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arin-core.workspace = true
arin-protocol.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

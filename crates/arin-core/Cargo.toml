[package]
name = "arin-core"
description = "Arin daemon: socket server, session and annotation state, platform traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# Not published. Only `arin-protocol` goes to crates.io today, because it is the only
# crate with readers outside this repo. This is a safety catch rather than a policy: a
# stray `cargo publish` here would burn the name at 0.1.0 on a crate with no README, and
# crates.io versions can be yanked but never reused. Lift it per crate as each one is
# actually packaged. See the distribution row in `AGENTS.md`.
publish = false

[dependencies]
arin-protocol.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true

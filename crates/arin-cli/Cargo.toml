[package]
name = "arin-cli"
description = "The arin command line tool: daemon control, debug commands, scripting client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

# The published binary is `arin`; the crate is `arin-cli` so the name matches the rest of
# the workspace. Only this binary is published at 0.1.
[[bin]]
name = "arin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arin-core.workspace = true
arin-protocol.workspace = true
clap.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
arin-mac.workspace = true
# Carbon `RegisterEventHotKey` under the hood for ordinary chords, which needs no
# permission. Only registered on macOS for now, since it is the only platform with a
# renderer and the Linux build would otherwise pull in an X11 stack for nothing.
global-hotkey.workspace = true
# For the MainThreadMarker that `arin displays` needs before touching AppKit.
objc2.workspace = true

[lints]
workspace = true

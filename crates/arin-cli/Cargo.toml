[package]
name = "arin-cli"
description = "The arin command line tool: daemon control, debug commands, scripting client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# Not published. Only `arin-protocol` goes to crates.io today, because it is the only
# crate with readers outside this repo. This is a safety catch rather than a policy: a
# stray `cargo publish` here would burn the name at 0.1.0 on a crate with no README, and
# crates.io versions can be yanked but never reused. Lift it per crate as each one is
# actually packaged. See the distribution row in `AGENTS.md`.
publish = false

# The package is `arin-cli` and the binary is `arin`, which is what users type. The names
# differ because the workspace already has a crate called `arin`: the published facade
# that reserves the name on crates.io. Package names are unique per workspace, so this one
# takes the qualified spelling and the binary keeps the plain one.
[[bin]]
name = "arin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arin-core.workspace = true
arin-protocol.workspace = true
arin-resolve.workspace = true
clap.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
arin-mac.workspace = true
# Carbon `RegisterEventHotKey` under the hood for ordinary chords, which needs no
# permission. Only registered on macOS for now, since it is the only platform with a
# renderer and the Linux build would otherwise pull in an X11 stack for nothing.
global-hotkey.workspace = true
# For the MainThreadMarker that `arin displays` needs before touching AppKit.
objc2.workspace = true

[lints]
workspace = true

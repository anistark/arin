[package]
name = "arin-mac"
description = "macOS renderer and capture backends for Arin. NSPanel, Core Animation, ScreenCaptureKit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# Not published. Only `arin-protocol` goes to crates.io today, because it is the only
# crate with readers outside this repo. This is a safety catch rather than a policy: a
# stray `cargo publish` here would burn the name at 0.1.0 on a crate with no README, and
# crates.io versions can be yanked but never reused. Lift it per crate as each one is
# actually packaged. See the distribution row in `AGENTS.md`.
publish = false

[dependencies]
arin-core.workspace = true
arin-protocol.workspace = true
# `Approver::ask` returns a `BoxFuture`, and the consent prompt hands its answer back from
# the main queue over a oneshot. No async runtime is pulled in for either.
futures.workspace = true
tracing.workspace = true

# Target-gated so the workspace still builds on Linux CI, where this crate compiles to
# nothing. Core must never depend on it either way.
#
# objc2 gates every class behind a feature, so each one used here is listed.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  # Only for NSWorkspace's display preferences, to draw marks whole under Reduce Motion.
  # Nothing here reads or drives another application's accessibility tree.
  "NSAccessibility",
  # The grounding consent prompt.
  "NSAlert",
  # The screenshot selector's bar is dark whatever the system appearance, like the
  # system's own.
  "NSAppearance",
  "NSApplication",
  # NSAttributedString carries NSFontAttributeName, which is how a caption is measured.
  "NSAttributedString",
  # Encoding a screenshot as a PNG.
  "NSBitmapImageRep",
  "NSButton",
  "NSCell",
  "NSColor",
  "NSControl",
  # The marker's pointer, and the tracking area that asks for it.
  "NSCursor",
  "NSEvent",
  "NSFont",
  "NSFontDescriptor",
  "NSImage",
  "NSImageRep",
  "NSMenu",
  "NSMenuItem",
  "NSGraphics",
  "NSPanel",
  "NSResponder",
  # Bringing an application forward. `libc` comes with it, for the `pid_t` that
  # `runningApplicationWithProcessIdentifier` takes.
  "NSRunningApplication",
  "libc",
  "NSScreen",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSStringDrawing",
  # The size readout in the screenshot selector's bar, and its alignment.
  "NSText",
  "NSTextField",
  "NSTrackingArea",
  "NSView",
  # The blurred material behind a text box.
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-foundation = { workspace = true, features = [
  "CFArray",
  "CFCGTypes",
  # Reading where the person keeps their screenshots.
  "CFPreferences",
  "CFString",
  "CFURL",
] }
# Listing the fonts the person installed, to write in their handwriting font if they have
# one.
objc2-core-text = { workspace = true, features = ["CTFontManager"] }
objc2-core-graphics = { workspace = true, features = [
  "CGColor",
  "CGDataProvider",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGImage",
  "CGColorSpace",
  "CGPath",
  "CGWindow",
] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSData",
  # A screenshot's file name says when it was taken.
  "NSDate",
  "NSDateFormatter",
  "NSError",
  "NSDictionary",
  "NSFormatter",
  "NSGeometry",
  "NSLocale",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-quartz-core = { workspace = true, features = [
  "CAAnimation",
  "CABase",
  "CAEmitterCell",
  "CAEmitterLayer",
  "CAGradientLayer",
  "CALayer",
  "CAMediaTiming",
  "CAMediaTimingFunction",
  "CAShapeLayer",
  "CATextLayer",
  "CATransaction",
  "CATransform3D",
  # Taking the screenshot flash off once it has faded.
  "block2",
  "objc2-core-graphics",
] }

objc2-screen-capture-kit = { workspace = true, features = [
  "SCError",
  "SCScreenshotManager",
  "SCShareableContent",
  "SCStream",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }

[lints]
workspace = true

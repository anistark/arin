[package]
name = "arin-mac"
description = "macOS renderer and capture backends for Arin. NSPanel, Core Animation, ScreenCaptureKit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
arin-core.workspace = true
arin-protocol.workspace = true
tracing.workspace = true

# Target-gated so the workspace still builds on Linux CI, where this crate compiles to
# nothing. Core must never depend on it either way.
#
# objc2 gates every class behind a feature, so each one used here is listed.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSApplication",
  # NSAttributedString carries NSFontAttributeName, which is how a caption is measured.
  "NSAttributedString",
  "NSButton",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSGraphics",
  "NSPanel",
  "NSResponder",
  "NSScreen",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSStringDrawing",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = [
  "CGColor",
  "CGDataProvider",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGImage",
  "CGColorSpace",
  "CGPath",
  "CGWindow",
] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSError",
  "NSDictionary",
  "NSGeometry",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-quartz-core = { workspace = true, features = [
  "CAAnimation",
  "CABase",
  "CAEmitterCell",
  "CAEmitterLayer",
  "CAGradientLayer",
  "CALayer",
  "CAMediaTiming",
  "CAMediaTimingFunction",
  "CAShapeLayer",
  "CATextLayer",
  "CATransaction",
  "CATransform3D",
  "objc2-core-graphics",
] }

objc2-screen-capture-kit = { workspace = true, features = [
  "SCError",
  "SCScreenshotManager",
  "SCShareableContent",
  "SCStream",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }

[lints]
workspace = true
